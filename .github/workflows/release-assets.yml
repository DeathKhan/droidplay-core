# Adds DroidPlay for Windows' installers and DroidPlay Core's source to a release. DroidPlay-Setup-<version>.exe (with its .sha256) is the one players download:
# windows-package.yml builds and checks it from the release's tag. Install DroidPlay.cmd, the installer before it, stays for the players who have it. Install DroidPlay.cmd downloads the source as droidplay-core-<version>.tar.xz
# (about 55 MB) or .zip (about 90 MB) rather than the archive GitHub makes of the tag (about 130 MB): GitHub serves release assets from its download network,
# where a download that is cut off can resume, and these leave out docs/ (screenshots) and .github/, which the app doesn't use. Publishing a release runs this
# from the release's tag; Run workflow (from main) adds the assets to a release made before the tag had this file.
name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (v0.2.0)
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  assets:
    name: Installer and source assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Pack the source and upload it with the installer
        run: |
          name="droidplay-core-${TAG#v}"
          # VERSION: the release's version, which the launcher app is given (build_android_from_nsp.py core_version); a checkout has git describe instead.
          # --add-file, not --add-virtual-file: git puts a virtual file outside --prefix
          printf '%s\n' "${TAG#v}" > "$RUNNER_TEMP/VERSION"
          git archive --format=tar --prefix="$name/" --add-file="$RUNNER_TEMP/VERSION" HEAD ':!docs' ':!.github' | xz -9 -T0 > "$name.tar.xz"
          git archive --format=zip -9 --prefix="$name/" --add-file="$RUNNER_TEMP/VERSION" HEAD ':!docs' ':!.github' > "$name.zip"
          # GitHub turns the space of an asset's name into a dot; the label keeps it
          cp dm/android/windows/install_droidplay.cmd Install.DroidPlay.cmd
          # the same archives under the name they had before the project was renamed from droidnative: the installers of 0.2.2 and earlier look only for
          # droidnative-<version>, and without it fall back to GitHub's slow archive of the tag
          legacy="droidnative-${TAG#v}"; cp "$name.tar.xz" "$legacy.tar.xz"; cp "$name.zip" "$legacy.zip"
          ls -l "$name.tar.xz" "$name.zip" "$legacy.tar.xz" "$legacy.zip" Install.DroidPlay.cmd
          gh release upload "$TAG" "$name.tar.xz" "$name.zip" "$legacy.tar.xz" "$legacy.zip" "Install.DroidPlay.cmd#Install DroidPlay.cmd" --clobber --repo "$GITHUB_REPOSITORY"

  setup:
    name: DroidPlay for Windows' Setup, built and checked
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ github.event.release.tag_name || inputs.tag }}   # stage.ps1 drops the v
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

  setup-asset:
    name: Setup on the release
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DroidPlay-Setup
          path: setup
      - name: Upload DroidPlay-Setup and its checksum
        run: |
          ls -l setup
          gh release upload "$TAG" setup/DroidPlay-Setup-*.exe setup/DroidPlay-Setup-*.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
